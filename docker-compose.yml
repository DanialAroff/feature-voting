services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-feature_voting}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-feature_voting}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production build of the app: docker compose --profile app up --build
  app:
    build: .
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-feature_voting}
      NODE_ENV: production
      # Served over plain http://localhost here; behind HTTPS leave this unset.
      COOKIE_SECURE: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # One-off tasks without Node on the host, using the build stage (has dev tools):
  #   docker compose run --rm tools                  → apply migrations
  #   docker compose run --rm tools npm run db:seed  → load demo data
  tools:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-feature_voting}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
